[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexrouter"
version = "0.1.0"
description = "Stack every provider's free-tier LLMs behind one OpenAI-compatible address, with automatic failover and a live dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "tiktoken>=0.7",
    "click>=8.1",
]

[project.scripts]
flexrouter = "flexrouter.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flexrouter*"]

[tool.setuptools.package-data]
"flexrouter.dashboard" = ["static/**/*", "*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
