<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flexrouter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131a30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- mark: three provider tiers stacking/merging into one address -->
  <g>
    <g stroke-linecap="round">
      <rect x="70" y="72" width="72" height="16" rx="8" fill="#7dd3fc" opacity="0.9"/>
      <rect x="70" y="122" width="72" height="16" rx="8" fill="#a78bfa" opacity="0.9"/>
      <rect x="70" y="172" width="72" height="16" rx="8" fill="#34d399" opacity="0.9"/>
    </g>
    <g stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M 142 80 C 220 80, 260 128, 330 130" stroke="#7dd3fc"/>
      <path d="M 142 130 C 220 130, 260 130, 330 130" stroke="#a78bfa"/>
      <path d="M 142 180 C 220 180, 260 132, 330 130" stroke="#34d399"/>
    </g>
    <circle cx="330" cy="130" r="12" fill="#e2e8f0"/>
    <circle cx="330" cy="130" r="26" fill="url(#dot-glow)"/>
  </g>

  <text x="390" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#title)">flexrouter</text>
  <text x="392" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#9aa4c7">stack every provider's free tier behind one address</text>
</svg>
