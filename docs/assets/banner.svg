<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flexrouter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131a30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- routing motif: several nodes, one lit path from left to a chosen node -->
  <g stroke="#334166" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 120 130 C 260 60, 340 60, 430 92"/>
    <path d="M 120 130 C 260 130, 340 130, 430 130"/>
    <path d="M 120 130 C 260 200, 340 200, 430 176"/>
  </g>
  <path d="M 120 130 C 260 130, 340 130, 430 130" stroke="#34d399" stroke-width="3" fill="none"/>

  <circle cx="120" cy="130" r="10" fill="#e2e8f0"/>
  <circle cx="430" cy="92" r="7" fill="#475173"/>
  <circle cx="430" cy="176" r="7" fill="#475173"/>
  <circle cx="430" cy="130" r="11" fill="#34d399"/>
  <circle cx="430" cy="130" r="22" fill="url(#dot-glow)"/>

  <text x="490" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#title)">flexrouter</text>
  <text x="492" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#9aa4c7">one address for every LLM you use, with automatic failover</text>
</svg>
